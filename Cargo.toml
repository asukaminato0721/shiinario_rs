[workspace]
members = ["crates/na_mpeg2_decoder", "crates/shiinario_core", "crates/shiinario_assets", "crates/shiinario_scenario", "crates/shiinario_runtime", "crates/shiinario_cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shiinario_assets = { path = "crates/shiinario_assets" }
shiinario_core = { path = "crates/shiinario_core" }
shiinario_scenario = { path = "crates/shiinario_scenario" }
shiinario_runtime = { path = "crates/shiinario_runtime" }
