name: Autofix

# Apply `cargo clippy --fix` and `cargo fmt`, then open (or refresh) one PR against master.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: autofix

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcb1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev

      # Clippy first: its rewrites are not guaranteed to be rustfmt-clean.
      - name: cargo clippy --fix
        run: cargo clippy --fix --allow-dirty --locked --workspace --all-targets

      - name: cargo fmt
        run: cargo fmt --all

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          base: master
          branch: autofix/clippy-fmt
          delete-branch: true
          commit-message: "autofix: cargo clippy --fix + cargo fmt"
          title: "autofix: cargo clippy --fix + cargo fmt"
          body: |
            Automated run of `cargo clippy --fix --workspace --all-targets` followed by `cargo fmt --all`.

            Clippy fixes were applied for the Linux host target only.
